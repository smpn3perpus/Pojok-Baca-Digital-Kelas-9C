<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daftar Anggota - Pojok Baca Digital Kelas 9C</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        linear-gradient(
            rgba(15,23,42,.82),
            rgba(30,41,59,.90)
        ),
        linear-gradient(
            135deg,
            #0f172a,
            #1e3a8a,
            #0f766e
        );
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:520px;
}

.card{
    background:rgba(15,23,42,.96);
    border:1px solid rgba(148,163,184,.25);
    border-radius:20px;
    padding:30px;
    box-shadow:
        0 25px 60px rgba(0,0,0,.45);
}

.header{
    text-align:center;
    margin-bottom:24px;
}

.logo{
    font-size:52px;
    margin-bottom:8px;
}

.title{
    font-size:25px;
    font-weight:800;
    line-height:1.25;
}

.subtitle{
    margin-top:7px;
    color:#cbd5e1;
    font-size:14px;
}

.slogan{
    margin-top:8px;
    color:#93c5fd;
    font-weight:600;
    font-style:italic;
}

.role-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:22px;
    background:#0f172a;
    padding:5px;
    border-radius:11px;
}

.role-tab{
    border:0;
    border-radius:8px;
    padding:11px;
    cursor:pointer;
    background:transparent;
    color:#94a3b8;
    font-weight:700;
    font-size:14px;
}

.role-tab.active{
    background:#2563eb;
    color:#fff;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#e2e8f0;
    font-weight:600;
    font-size:14px;
}

input{
    width:100%;
    padding:12px 13px;
    border:1px solid #475569;
    border-radius:9px;
    outline:none;
    background:#1e293b;
    color:#fff;
    font-size:15px;
}

input::placeholder{
    color:#64748b;
}

input:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(59,130,246,.15);
}

input[readonly]{
    background:#334155;
    color:#cbd5e1;
    cursor:not-allowed;
}

.password-wrapper{
    position:relative;
}

.password-wrapper input{
    padding-right:48px;
}

.toggle-password{
    position:absolute;
    right:5px;
    top:50%;
    transform:translateY(-50%);
    width:38px;
    height:38px;
    border:0;
    background:transparent;
    color:#94a3b8;
    cursor:pointer;
    border-radius:7px;
}

.toggle-password:hover{
    background:#334155;
    color:#fff;
}

.help{
    margin-top:5px;
    font-size:12px;
    color:#94a3b8;
    line-height:1.5;
}

.btn-register{
    width:100%;
    border:0;
    border-radius:10px;
    padding:13px;
    background:#2563eb;
    color:#fff;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    margin-top:5px;
}

.btn-register:hover{
    background:#1d4ed8;
}

.btn-register:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.login-link{
    text-align:center;
    margin-top:18px;
    color:#94a3b8;
    font-size:14px;
}

.login-link a{
    color:#60a5fa;
    text-decoration:none;
    font-weight:700;
}

.login-link a:hover{
    text-decoration:underline;
}

.message{
    display:none;
    padding:11px 13px;
    border-radius:9px;
    margin-bottom:16px;
    font-size:13px;
    line-height:1.5;
}

.message.error{
    display:block;
    background:#450a0a;
    border:1px solid #dc2626;
    color:#fecaca;
}

.message.success{
    display:block;
    background:#052e16;
    border:1px solid #16a34a;
    color:#bbf7d0;
}

.footer{
    text-align:center;
    margin-top:18px;
    color:#94a3b8;
    font-size:12px;
}

.hidden{
    display:none !important;
}

.loading{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.spinner{
    width:16px;
    height:16px;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:500px){

    body{
        padding:12px;
    }

    .card{
        padding:22px 18px;
        border-radius:16px;
    }

    .title{
        font-size:21px;
    }

    .logo{
        font-size:44px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">

            <div class="logo">
                📚
            </div>

            <div class="title">
                Pojok Baca Digital Kelas 9C
            </div>

            <div class="subtitle">
                SMP Negeri 3 Sibolga
            </div>

            <div class="slogan">
                Reader Now, Leader Tomorrow
            </div>

        </div>


        <!-- ROLE -->

        <div class="role-tabs">

            <button
                type="button"
                id="tabSiswa"
                class="role-tab active"
                onclick="pilihRole('siswa')">

                👨‍🎓 Siswa

            </button>

            <button
                type="button"
                id="tabGuru"
                class="role-tab"
                onclick="pilihRole('guru')">

                👨‍🏫 Guru

            </button>

        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>


        <!-- FORM -->

        <form id="registerForm">


            <!-- NAMA -->

            <div class="form-group">

                <label for="nama">
                    👤 Nama Lengkap
                </label>

                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama lengkap"
                    autocomplete="name"
                    required>

            </div>


            <!-- IDENTITAS SISWA -->

            <div
                class="form-group"
                id="groupNisn">

                <label for="identitas">

                    🆔 NISN

                </label>

                <input
                    type="text"
                    id="identitas"
                    placeholder="Masukkan NISN"
                    inputmode="numeric"
                    autocomplete="off"
                    required>

                <div class="help">
                    Siswa mendaftar menggunakan NISN.
                </div>

            </div>


            <!-- IDENTITAS GURU -->

            <div
                class="form-group hidden"
                id="groupNip">

                <label for="identitasGuru">

                    🆔 NIP / NIK

                </label>

                <input
                    type="text"
                    id="identitasGuru"
                    placeholder="Masukkan NIP atau NIK"
                    autocomplete="off">

                <div class="help">
                    Guru mendaftar menggunakan NIP atau NIK.
                </div>

            </div>


            <!-- KELAS SISWA -->

            <div
                class="form-group"
                id="groupKelas">

                <label for="kelas">
                    🏫 Kelas
                </label>

                <input
                    type="text"
                    id="kelas"
                    value="9C"
                    readonly>

                <div class="help">
                    Pendaftaran siswa hanya untuk kelas 9C.
                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    🔒 Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimal 6 karakter"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('password',this)"
                        aria-label="Tampilkan password">

                        👁️

                    </button>

                </div>

            </div>


            <!-- KONFIRMASI PASSWORD -->

            <div class="form-group">

                <label for="passwordConfirm">
                    🔐 Konfirmasi Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="passwordConfirm"
                        placeholder="Masukkan ulang password"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('passwordConfirm',this)"
                        aria-label="Tampilkan password">

                        👁️

                    </button>

                </div>

            </div>


            <button
                type="submit"
                id="btnRegister"
                class="btn-register">

                📝 Daftar Sekarang

            </button>

        </form>


        <div class="login-link">

            Sudah punya akun?

            <a href="login.html">
                Login di sini
            </a>

        </div>

    </div>


    <div class="footer">

        Dibuat oleh Mr. Rahmat Batubara, S.T.P.

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://veffzxxrsjfgupynryog.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_2HoFz3ZTlrOX_DTGsIW3og_7cHS0LLG";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ROLE AKTIF
===================================================== */

let roleAktif =
    "siswa";


/* =====================================================
   ELEMENT
===================================================== */

const tabSiswa =
    document.getElementById(
        "tabSiswa"
    );

const tabGuru =
    document.getElementById(
        "tabGuru"
    );

const groupNisn =
    document.getElementById(
        "groupNisn"
    );

const groupNip =
    document.getElementById(
        "groupNip"
    );

const groupKelas =
    document.getElementById(
        "groupKelas"
    );

const identitas =
    document.getElementById(
        "identitas"
    );

const identitasGuru =
    document.getElementById(
        "identitasGuru"
    );

const message =
    document.getElementById(
        "message"
    );

const registerForm =
    document.getElementById(
        "registerForm"
    );

const btnRegister =
    document.getElementById(
        "btnRegister"
    );


/* =====================================================
   PILIH ROLE
===================================================== */

window.pilihRole =
function(role){

    roleAktif =
        role;


    hapusPesan();


    if(role === "siswa"){

        tabSiswa.classList.add(
            "active"
        );

        tabGuru.classList.remove(
            "active"
        );


        groupNisn.classList.remove(
            "hidden"
        );

        groupKelas.classList.remove(
            "hidden"
        );

        groupNip.classList.add(
            "hidden"
        );


        identitas.required =
            true;

        identitasGuru.required =
            false;


        identitas.value =
            "";

        identitasGuru.value =
            "";


        identitas.placeholder =
            "Masukkan NISN";


    }else{

        tabGuru.classList.add(
            "active"
        );

        tabSiswa.classList.remove(
            "active"
        );


        groupNisn.classList.add(
            "hidden"
        );

        groupKelas.classList.add(
            "hidden"
        );

        groupNip.classList.remove(
            "hidden"
        );


        identitas.required =
            false;

        identitasGuru.required =
            true;


        identitas.value =
            "";

        identitasGuru.value =
            "";


        identitasGuru.placeholder =
            "Masukkan NIP atau NIK";
    }

};


/* =====================================================
   TAMPILKAN PASSWORD
===================================================== */

window.togglePassword =
function(id,button){

    const input =
        document.getElementById(
            id
        );


    if(
        input.type ===
        "password"
    ){

        input.type =
            "text";

        button.textContent =
            "🙈";

    }else{

        input.type =
            "password";

        button.textContent =
            "👁️";
    }
};


/* =====================================================
   PESAN
===================================================== */

function tampilError(
    text
){

    message.className =
        "message error";

    message.innerHTML =
        text;

    message.style.display =
        "block";
}


function tampilSuccess(
    text
){

    message.className =
        "message success";

    message.innerHTML =
        text;

    message.style.display =
        "block";
}


function hapusPesan(){

    message.className =
        "message";

    message.innerHTML =
        "";

    message.style.display =
        "none";
}


/* =====================================================
   VALIDASI
===================================================== */

function normalisasiIdentitas(
    value
){

    return String(value || "")
        .trim()
        .replace(/\s+/g,"");
}


/* =====================================================
   SUBMIT REGISTER
===================================================== */

registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        hapusPesan();


        const nama =
            document.getElementById(
                "nama"
            )
            .value
            .trim();


        const password =
            document.getElementById(
                "password"
            )
            .value;


        const passwordConfirm =
            document.getElementById(
                "passwordConfirm"
            )
            .value;


        /* =========================================
           VALIDASI NAMA
        ========================================= */

        if(!nama){

            tampilError(
                "❌ Nama lengkap wajib diisi."
            );

            return;
        }


        /* =========================================
           VALIDASI PASSWORD
        ========================================= */

        if(
            password.length <
            6
        ){

            tampilError(
                "❌ Password minimal 6 karakter."
            );

            return;
        }


        if(
            password !==
            passwordConfirm
        ){

            tampilError(
                "❌ Konfirmasi password tidak sama."
            );

            return;
        }


        /* =========================================
           IDENTITAS
        ========================================= */

        let nomorIdentitas =
            "";


        let nisn =
            null;

        let kelas =
            null;


        if(
            roleAktif ===
            "siswa"
        ){

            nomorIdentitas =
                normalisasiIdentitas(
                    identitas.value
                );


            if(!nomorIdentitas){

                tampilError(
                    "❌ NISN wajib diisi."
                );

                return;
            }


            /*
               NISN umumnya berupa angka.
               Kita tidak memaksa panjang tertentu
               agar data sekolah yang sudah ada
               tetap fleksibel.
            */

            if(
                !/^\d+$/.test(
                    nomorIdentitas
                )
            ){

                tampilError(
                    "❌ NISN harus berupa angka."
                );

                return;
            }


            nisn =
                nomorIdentitas;

            kelas =
                "9C";


        }else{

            nomorIdentitas =
                normalisasiIdentitas(
                    identitasGuru.value
                );


            if(!nomorIdentitas){

                tampilError(
                    "❌ NIP / NIK wajib diisi."
                );

                return;
            }

        }


        /* =========================================
           TOMBOL LOADING
        ========================================= */

        btnRegister.disabled =
            true;


        btnRegister.innerHTML =
            `
            <span class="loading">
                <span class="spinner"></span>
                Memproses pendaftaran...
            </span>
            `;


        try{

            /* =====================================
               CEK IDENTITAS DUPLIKAT

               Kita menggunakan kolom
               identitas sebagai identitas utama.

               Guru:
                   identitas = NIP/NIK

               Siswa:
                   identitas = NISN
            ===================================== */

            const {
                data: existingIdentity,
                error: identityError
            } = await db
                .from("anggota")
                .select("id,nama,jenis_anggota,identitas")
                .eq(
                    "identitas",
                    nomorIdentitas
                )
                .maybeSingle();


            if(identityError){

                console.error(
                    "Error cek identitas:",
                    identityError
                );


                throw identityError;
            }


            if(existingIdentity){

                tampilError(
                    "❌ Identitas tersebut sudah terdaftar. " +
                    "Jika sudah memiliki akun, silakan login."
                );

                return;
            }


            /* =====================================
               CEK NISN LAMA

               Untuk menjaga kompatibilitas
               dengan data siswa lama.
            ===================================== */

            if(
                roleAktif ===
                "siswa"
            ){

                const {
                    data: existingNisn,
                    error: nisnError
                } = await db
                    .from("anggota")
                    .select("id,nama,nisn")
                    .eq(
                        "nisn",
                        nisn
                    )
                    .maybeSingle();


                if(nisnError){

                    console.error(
                        "Error cek NISN:",
                        nisnError
                    );


                    throw nisnError;
                }


                if(existingNisn){

                    tampilError(
                        "❌ NISN tersebut sudah terdaftar. " +
                        "Silakan gunakan akun yang sudah ada."
                    );

                    return;
                }

            }


            /* =====================================
               DATA YANG AKAN DISIMPAN

               TIDAK ADA pengecekan struktur tabel
               di sini karena struktur database
               sudah dipastikan benar.
            ===================================== */

            const dataAnggota = {

                nama:
                    nama,

                nisn:
                    nisn,

                kelas:
                    kelas,

                password:
                    password,

                jenis_anggota:
                    roleAktif,

                identitas:
                    nomorIdentitas

            };


            console.log(
                "Data pendaftaran:",
                {
                    ...dataAnggota,
                    password:
                        "********"
                }
            );


            /* =====================================
               INSERT
            ===================================== */

            const {
                data,
                error
            } = await db
                .from("anggota")
                .insert(
                    dataAnggota
                )
                .select(
                    "id,nama,nisn,kelas,jenis_anggota,identitas"
                )
                .single();


            if(error){

                console.error(
                    "Error INSERT anggota:",
                    error
                );


                throw error;
            }


            /* =====================================
               BERHASIL
            ===================================== */

            console.log(
                "Pendaftaran berhasil:",
                data
            );


            tampilSuccess(
                roleAktif === "guru"
                    ? "✅ Pendaftaran guru berhasil! Mengarahkan ke halaman login..."
                    : "✅ Pendaftaran siswa kelas 9C berhasil! Mengarahkan ke halaman login..."
            );


            registerForm.reset();


            /*
               Kembalikan kelas siswa ke 9C
               karena reset() akan mengosongkan
               input readonly.
            */

            document.getElementById(
                "kelas"
            ).value =
                "9C";


            /*
               Beri waktu sebentar agar
               pesan berhasil terlihat.
            */

            setTimeout(
                function(){

                    window.location.href =
                        "login.html";

                },
                1200
            );


        }catch(error){

            console.error(
                "REGISTER ERROR:",
                error
            );


            let pesan =
                "❌ Pendaftaran gagal.";


            if(
                error &&
                error.message
            ){

                pesan +=
                    "<br><br>" +
                    error.message;
            }


            /*
               Pesan khusus jika ternyata
               ada masalah permission/RLS.
            */

            if(
                error &&
                (
                    error.code ===
                    "42501" ||
                    (
                        error.message &&
                        error.message
                            .toLowerCase()
                            .includes(
                                "row-level security"
                            )
                    )
                )
            ){

                pesan =
                    "❌ Pendaftaran ditolak oleh Row Level Security (RLS) Supabase." +
                    "<br><br>" +
                    "Periksa policy INSERT pada tabel anggota.";
            }


            tampilError(
                pesan
            );


        }finally{

            /*
               Jangan mengaktifkan kembali tombol
               jika proses berhasil karena halaman
               akan redirect.
            */

            btnRegister.disabled =
                false;

            btnRegister.innerHTML =
                "📝 Daftar Sekarang";

        }

    }
);


/* =====================================================
   DEFAULT
===================================================== */

pilihRole(
    "siswa"
);

</script>

</body>
</html>
