<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baca Buku - Pojok Baca Digital</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- PDF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --bg:#eef2f7;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#64748b;
    --danger:#dc2626;
    --success:#16a34a;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.header{
    background:linear-gradient(135deg,#1d4ed8,#2563eb,#3b82f6);
    color:white;
    padding:14px 18px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.header-title{
    font-size:20px;
    font-weight:bold;
}

.header-subtitle{
    font-size:12px;
    opacity:.9;
    margin-top:3px;
}

.user-info{
    text-align:right;
    font-size:13px;
}

.user-name{
    font-weight:bold;
}

.user-class{
    opacity:.9;
}

/* =========================
   READER
========================= */

.reader-wrapper{
    width:100%;
    max-width:1200px;
    margin:18px auto;
    padding:0 14px;
}

.book-info{
    background:white;
    border-radius:14px;
    padding:15px 18px;
    margin-bottom:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.book-title{
    font-size:21px;
    font-weight:bold;
    color:#1e3a8a;
}

.book-author{
    margin-top:5px;
    color:var(--muted);
    font-size:14px;
}

/* =========================
   CONTROL BAR
========================= */

.controls{
    background:#111827;
    color:white;
    border-radius:14px 14px 0 0;
    padding:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    position:sticky;
    top:72px;
    z-index:900;
}

.controls button{
    border:none;
    background:#374151;
    color:white;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

.controls button:hover{
    background:#4b5563;
}

.controls button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.controls .finish{
    background:#16a34a;
}

.controls .finish:hover{
    background:#15803d;
}

.controls .exit{
    background:#dc2626;
}

.controls .exit:hover{
    background:#b91c1c;
}

.page-info{
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 8px;
    font-size:14px;
}

#pageNumber{
    width:60px;
    padding:8px;
    border:none;
    border-radius:6px;
    text-align:center;
}

/* =========================
   TIMER
========================= */

.timer-box{
    background:#020617;
    border:1px solid #475569;
    padding:7px 12px;
    border-radius:8px;
    font-family:monospace;
    font-size:16px;
    font-weight:bold;
    color:#f8fafc;
}

.timer-label{
    font-family:Arial,Helvetica,sans-serif;
    font-size:11px;
    font-weight:normal;
    color:#cbd5e1;
    margin-right:4px;
}

/* =========================
   PDF AREA
========================= */

.pdf-area{
    background:#475569;
    min-height:70vh;
    padding:25px 10px 40px;
    border-radius:0 0 14px 14px;
    overflow:auto;
    box-shadow:0 5px 18px rgba(0,0,0,.15);
}

#pdfContainer{
    width:max-content;
    max-width:100%;
    margin:auto;
    position:relative;
}

#pdfCanvas{
    display:block;
    background:white;
    margin:auto;
    box-shadow:
        0 8px 25px rgba(0,0,0,.4),
        0 0 0 1px rgba(0,0,0,.15);
}

/* =========================
   LOADING
========================= */

.loading{
    min-height:50vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:15px;
    color:white;
    text-align:center;
}

.spinner{
    width:45px;
    height:45px;
    border:5px solid rgba(255,255,255,.3);
    border-top-color:white;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   ERROR
========================= */

.error-box{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:14px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

.error-box h2{
    color:#dc2626;
    margin-bottom:10px;
}

.error-box p{
    color:#64748b;
    line-height:1.6;
}

.error-box button{
    margin-top:18px;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    padding:20px 10px;
    color:#64748b;
    font-size:13px;
}

/* =========================
   FULLSCREEN
========================= */

body.reader-fullscreen .header,
body.reader-fullscreen .book-info,
body.reader-fullscreen footer{
    display:none;
}

body.reader-fullscreen .reader-wrapper{
    max-width:none;
    margin:0;
    padding:0;
}

body.reader-fullscreen .controls{
    top:0;
    border-radius:0;
}

body.reader-fullscreen .pdf-area{
    min-height:calc(100vh - 65px);
    border-radius:0;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    .header-inner{
        flex-direction:column;
        align-items:flex-start;
    }

    .user-info{
        text-align:left;
    }

    .header-title{
        font-size:17px;
    }

    .controls{
        top:83px;
    }

    .controls button{
        padding:8px 10px;
        font-size:13px;
    }

    .timer-box{
        font-size:14px;
    }

    .book-title{
        font-size:18px;
    }

    .pdf-area{
        padding:15px 5px 30px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">
    <div class="header-inner">

        <div>
            <div class="header-title">
                📖 Pojok Baca Digital
            </div>

            <div class="header-subtitle">
                Perpustakaan Digital SMP Negeri 3 Sibolga
            </div>
        </div>

        <div class="user-info">
            <div class="user-name" id="userName">
                Memuat...
            </div>

            <div class="user-class" id="userClass">
                -
            </div>
        </div>

    </div>
</header>


<!-- =========================
     MAIN READER
========================= -->

<main class="reader-wrapper">

    <!-- INFORMASI BUKU -->

    <section class="book-info">

        <div class="book-title" id="bookTitle">
            Memuat buku...
        </div>

        <div class="book-author" id="bookAuthor">
            -
        </div>

    </section>


    <!-- KONTROL -->

    <section class="controls">

        <button id="prevBtn" onclick="prevPage()">
            ◀ Sebelumnya
        </button>

        <div class="page-info">

            <input
                type="number"
                id="pageNumber"
                min="1"
                value="1"
                onchange="goToPage()"
            >

            <span>
                /
                <span id="pageCount">0</span>
            </span>

        </div>

        <button id="nextBtn" onclick="nextPage()">
            Berikutnya ▶
        </button>

        <button onclick="zoomOut()">
            🔍−
        </button>

        <button onclick="zoomIn()">
            🔍+
        </button>

        <button onclick="fitPage()">
            📄 Fit
        </button>

        <button onclick="toggleFullscreen()">
            ⛶
        </button>

        <div class="timer-box">

            </span>

                00:00:00
            </span>
        </div>

        <button
            class="finish"
            onclick="selesaiMembaca()"
        >
            ✅ Selesai Membaca
        </button>

        <button
            class="exit"
            onclick="kembaliKeKoleksi()"
        >
            ✕ Keluar
        </button>

    </section>


    <!-- AREA PDF -->

    <section class="pdf-area" id="pdfArea">

        <div class="loading" id="loading">

            <div class="spinner"></div>

            <div>
                Memuat buku...
            </div>

        </div>

        <div id="pdfContainer" style="display:none;">

            <canvas id="pdfCanvas"></canvas>

        </div>

    </section>

</main>


<footer>

</footer>


<script>

/* =========================================================
   KONFIGURASI SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://veffzxxrsjfgupynryog.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_2HoFz3ZTlrOX_DTGsIW3og_7cHS0LLG";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   PDF.JS WORKER
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   VARIABEL
========================================================= */

let pdfDoc = null;

let currentPage = 1;

let totalPages = 0;

let scale = 1.2;

let buku = null;

let anggota = null;

let riwayatId = null;

let timerSeconds = 0;

let timerInterval = null;

let saveInterval = null;

let readerActive = true;

let lastSavedMinute = 0;


/* =========================================================
   CEK LOGIN
========================================================= */

function cekLogin(){

    const data =
        localStorage.getItem("pojok_baca_anggota");

    if(!data){

        window.location.replace("login.html");

        return false;
    }

    try{

        anggota = JSON.parse(data);

        if(!anggota.id){

            throw new Error(
                "Data anggota tidak valid"
            );

        }

        document.getElementById("userName")
            .textContent =
            anggota.nama || "Anggota";

        document.getElementById("userClass")
            .textContent =
            "Kelas " + (anggota.kelas || "-");

        return true;

    }catch(error){

        console.error(error);

        localStorage.removeItem(
            "pojok_baca_anggota"
        );

        window.location.replace("login.html");

        return false;
    }
}


/* =========================================================
   AMBIL ID BUKU DARI URL
========================================================= */

function getBookId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");
}


/* =========================================================
   AMBIL DATA BUKU
========================================================= */

async function loadBook(){

    const bookId = getBookId();

    if(!bookId){

        tampilkanError(
            "Buku tidak ditemukan",
            "ID buku tidak tersedia."
        );

        return;
    }

    try{

        const {
            data,
            error
        } = await db
            .from("buku")
            .select("*")
            .eq("id", bookId)
            .maybeSingle();

        if(error){

            console.error(error);

            throw new Error(
                "Gagal mengambil data buku."
            );
        }

        if(!data){

            throw new Error(
                "Buku tidak ditemukan di database."
            );
        }

        buku = data;

        document.getElementById("bookTitle")
            .textContent =
            "📖 " + (buku.judul || "Tanpa Judul");

        document.getElementById("bookAuthor")
            .textContent =
            "Penulis: " +
            (buku.penulis || "-") +
            " • Penerbit: " +
            (buku.penerbit || "-") +
            " • Tahun: " +
            (buku.tahun_terbit || "-");


        await mulaiRiwayat();

        await loadPDF();

    }catch(error){

        console.error(error);

        tampilkanError(
            "Gagal Memuat Buku",
            error.message
        );
    }
}


/* =========================================================
   MULAI RIWAYAT MEMBACA
========================================================= */

async function mulaiRiwayat(){

    try{

        const {
            data,
            error
        } = await db
            .from("riwayat_baca")
            .insert({
                anggota_id: anggota.id,
                buku_id: buku.id,
                mulai_baca: new Date().toISOString(),
                durasi_menit: 0
            })
            .select("id")
            .single();

        if(error){

            console.error(
                "Gagal membuat riwayat:",
                error
            );

            return;
        }

        riwayatId = data.id;

        console.log(
            "Riwayat membaca dimulai:",
            riwayatId
        );

        mulaiTimer();

    }catch(error){

        console.error(error);

    }
}


/* =========================================================
   LOAD PDF
========================================================= */

async function loadPDF(){

    if(!buku || !buku.file_url){

        throw new Error(
            "File PDF buku belum tersedia."
        );
    }

    let pdfUrl =
        buku.file_url.trim();


    /*
       Jika URL Google Drive berbentuk:
       https://drive.google.com/file/d/FILE_ID/view...
       
       ubah menjadi URL preview Google Drive.
    */

    const driveMatch =
        pdfUrl.match(
            /drive\.google\.com\/file\/d\/([^/]+)/
        );

    if(driveMatch){

        const fileId =
            driveMatch[1];

        pdfUrl =
            "https://drive.google.com/uc?export=download&id=" +
            fileId;
    }


    try{

        const loadingTask =
            pdfjsLib.getDocument({
                url: pdfUrl,
                withCredentials:false
            });

        pdfDoc =
            await loadingTask.promise;

        totalPages =
            pdfDoc.numPages;

        document.getElementById("pageCount")
            .textContent =
            totalPages;

        document.getElementById("pageNumber")
            .max =
            totalPages;

        document.getElementById("loading")
            .style.display =
            "none";

        document.getElementById("pdfContainer")
            .style.display =
            "block";

        await renderPage(currentPage);

        updateNavigation();

    }catch(error){

        console.error(
            "PDF ERROR:",
            error
        );

        throw new Error(
            "PDF tidak dapat dibuka di dalam aplikasi. " +
            "Jika file berasal dari Google Drive, pastikan " +
            "akses file disetel agar dapat dilihat oleh siapa pun yang memiliki link."
        );
    }
}


/* =========================================================
   RENDER HALAMAN PDF
========================================================= */

async function renderPage(pageNumber){

    if(!pdfDoc){

        return;
    }

    try{

        const page =
            await pdfDoc.getPage(
                pageNumber
            );

        const viewport =
            page.getViewport({
                scale:scale
            });

        const canvas =
            document.getElementById(
                "pdfCanvas"
            );

        const context =
            canvas.getContext("2d");

        canvas.width =
            viewport.width;

        canvas.height =
            viewport.height;

        await page.render({
            canvasContext:context,
            viewport:viewport
        }).promise;

        currentPage =
            pageNumber;

        document.getElementById("pageNumber")
            .value =
            currentPage;

        updateNavigation();

    }catch(error){

        console.error(
            "Render error:",
            error
        );
    }
}


/* =========================================================
   HALAMAN SEBELUMNYA
========================================================= */

function prevPage(){

    if(currentPage <= 1){

        return;
    }

    currentPage--;

    renderPage(currentPage);
}


/* =========================================================
   HALAMAN BERIKUTNYA
========================================================= */

function nextPage(){

    if(currentPage >= totalPages){

        return;
    }

    currentPage++;

    renderPage(currentPage);
}


/* =========================================================
   KE HALAMAN TERTENTU
========================================================= */

function goToPage(){

    let page =
        parseInt(
            document.getElementById(
                "pageNumber"
            ).value
        );

    if(isNaN(page)){

        page = currentPage;
    }

    if(page < 1){

        page = 1;
    }

    if(page > totalPages){

        page = totalPages;
    }

    renderPage(page);
}


/* =========================================================
   UPDATE NAVIGASI
========================================================= */

function updateNavigation(){

    document.getElementById("prevBtn")
        .disabled =
        currentPage <= 1;

    document.getElementById("nextBtn")
        .disabled =
        currentPage >= totalPages;

    document.getElementById("pageNumber")
        .value =
        currentPage;
}


/* =========================================================
   ZOOM IN
========================================================= */

function zoomIn(){

    scale += 0.2;

    if(scale > 3){

        scale = 3;
    }

    renderPage(currentPage);
}


/* =========================================================
   ZOOM OUT
========================================================= */

function zoomOut(){

    scale -= 0.2;

    if(scale < 0.5){

        scale = 0.5;
    }

    renderPage(currentPage);
}


/* =========================================================
   FIT PAGE
========================================================= */

async function fitPage(){

    if(!pdfDoc){

        return;
    }

    const page =
        await pdfDoc.getPage(
            currentPage
        );

    const area =
        document.getElementById(
            "pdfArea"
        );

    const availableWidth =
        area.clientWidth - 40;

    const viewport =
        page.getViewport({
            scale:1
        });

    scale =
        availableWidth /
        viewport.width;

    if(scale < 0.5){

        scale = 0.5;
    }

    if(scale > 2.5){

        scale = 2.5;
    }

    renderPage(currentPage);
}


/* =========================================================
   TIMER MEMBACA
========================================================= */

function mulaiTimer(){

    clearInterval(
        timerInterval
    );

    timerInterval =
        setInterval(
            function(){

                if(!readerActive){

                    return;
                }

                timerSeconds++;

                tampilkanTimer();

            },
            1000
        );


    /*
       Simpan durasi setiap 30 detik.
       Ini membuat data tetap tersimpan walaupun
       pengguna menutup halaman sebelum menekan
       Selesai Membaca.
    */

    clearInterval(
        saveInterval
    );

    saveInterval =
        setInterval(
            function(){

                simpanDurasi(false);

            },
            30000
        );
}


/* =========================================================
   TAMPILKAN TIMER
========================================================= */

function tampilkanTimer(){

    const jam =
        Math.floor(
            timerSeconds / 3600
        );

    const menit =
        Math.floor(
            (timerSeconds % 3600) / 60
        );

    const detik =
        timerSeconds % 60;

    document.getElementById("timer")
        .textContent =
        String(jam).padStart(2,"0") +
        ":" +
        String(menit).padStart(2,"0") +
        ":" +
        String(detik).padStart(2,"0");
}


/* =========================================================
   SIMPAN DURASI
========================================================= */

async function simpanDurasi(finalUpdate){

    if(!riwayatId){

        return;
    }

    const durasiMenit =
        Math.floor(
            timerSeconds / 60
        );


    /*
       Jangan terlalu sering mengirim update
       kalau menitnya belum berubah.
    */

    if(
        !finalUpdate &&
        durasiMenit === lastSavedMinute
    ){

        return;
    }

    const updateData = {
        durasi_menit:durasiMenit
    };

    if(finalUpdate){

        updateData.selesai_baca =
            new Date().toISOString();
    }

    try{

        const {
            error
        } = await db
            .from("riwayat_baca")
            .update(updateData)
            .eq("id",riwayatId);

        if(error){

            console.error(
                "Gagal menyimpan durasi:",
                error
            );

            return;
        }

        lastSavedMinute =
            durasiMenit;

        console.log(
            "Durasi tersimpan:",
            durasiMenit,
            "menit"
        );

    }catch(error){

        console.error(error);
    }
}


/* =========================================================
   SELESAI MEMBACA
========================================================= */

async function selesaiMembaca(){

    if(!riwayatId){

        kembaliKeKoleksi();

        return;
    }

    const durasiMenit =
        Math.floor(
            timerSeconds / 60
        );


    const konfirmasi =
        confirm(
            "Selesai membaca buku ini?\n\n" +
            "Durasi membaca: " +
            formatDurasi(timerSeconds)
        );

    if(!konfirmasi){

        return;
    }


    readerActive = false;


    clearInterval(
        timerInterval
    );

    clearInterval(
        saveInterval
    );


    try{

        const {
            error
        } = await db
            .from("riwayat_baca")
            .update({
                selesai_baca:
                    new Date().toISOString(),

                durasi_menit:
                    durasiMenit
            })
            .eq("id",riwayatId);

        if(error){

            console.error(error);

            alert(
                "Riwayat selesai membaca gagal disimpan."
            );

            readerActive = true;

            return;
        }


        alert(
            "✅ Membaca selesai!\n\n" +
            "Buku: " +
            buku.judul +
            "\nDurasi membaca: " +
            formatDurasi(timerSeconds)
        );


        window.location.replace(
            "index.html"
        );

    }catch(error){

        console.error(error);

        alert(
            "Terjadi kesalahan saat menyimpan riwayat."
        );

        readerActive = true;
    }
}


/* =========================================================
   FORMAT DURASI
========================================================= */

function formatDurasi(totalSeconds){

    const jam =
        Math.floor(
            totalSeconds / 3600
        );

    const menit =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const detik =
        totalSeconds % 60;


    if(jam > 0){

        return (
            jam +
            " jam " +
            menit +
            " menit " +
            detik +
            " detik"
        );
    }

    if(menit > 0){

        return (
            menit +
            " menit " +
            detik +
            " detik"
        );
    }

    return (
        detik +
        " detik"
    );
}


/* =========================================================
   FULLSCREEN
========================================================= */

function toggleFullscreen(){

    const reader =
        document.documentElement;

    if(!document.fullscreenElement){

        if(
            reader.requestFullscreen
        ){

            reader
                .requestFullscreen()
                .then(function(){

                    document.body
                        .classList
                        .add(
                            "reader-fullscreen"
                        );

                })
                .catch(function(error){

                    console.error(error);

                });
        }

    }else{

        document
            .exitFullscreen()
            .then(function(){

                document.body
                    .classList
                    .remove(
                        "reader-fullscreen"
                    );

            });
    }
}


/* =========================================================
   DETEKSI FULLSCREEN BERUBAH
========================================================= */

document.addEventListener(
    "fullscreenchange",
    function(){

        if(document.fullscreenElement){

            document.body
                .classList
                .add(
                    "reader-fullscreen"
                );

        }else{

            document.body
                .classList
                .remove(
                    "reader-fullscreen"
                );
        }

    }
);


/* =========================================================
   KEMBALI KE KOLEKSI
========================================================= */

async function kembaliKeKoleksi(){

    const konfirmasi =
        confirm(
            "Keluar dari pembaca?\n\n" +
            "Durasi membaca yang sudah tersimpan " +
            "tetap akan dicatat."
        );

    if(!konfirmasi){

        return;
    }


    readerActive = false;


    clearInterval(
        timerInterval
    );

    clearInterval(
        saveInterval
    );


    await simpanDurasi(true);


    window.location.replace(
        "index.html"
    );
}


/* =========================================================
   HALAMAN ERROR
========================================================= */

function tampilkanError(
    judul,
    pesan
){

    document.getElementById("loading")
        .style.display =
        "none";

    document.getElementById("pdfContainer")
        .style.display =
        "none";

    const area =
        document.getElementById(
            "pdfArea"
        );

    area.innerHTML = `

        <div class="error-box">

            <h2>
                ❌ ${escapeHTML(judul)}
            </h2>

            <p>
                ${escapeHTML(pesan)}
            </p>

            <button
                onclick="kembaliKeKoleksi()"
            >
                ← Kembali ke Koleksi
            </button>

        </div>

    `;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   PAUSE TIMER SAAT TAB TIDAK AKTIF
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(document.hidden){

            readerActive = false;

            /*
               Simpan durasi terakhir
               sebelum halaman tidak aktif.
            */

            simpanDurasi(false);

        }else{

            readerActive = true;
        }

    }
);


/* =========================================================
   SAAT HALAMAN DITUTUP / PINDAH
========================================================= */

window.addEventListener(
    "pagehide",
    function(){

        /*
           Update biasa.
           Tidak mengganggu navigasi pengguna.
        */

        if(
            riwayatId &&
            timerSeconds > 0
        ){

            simpanDurasi(false);
        }

    }
);


/* =========================================================
   MULAI APLIKASI
========================================================= */

async function init(){

    const loginValid =
        cekLogin();

    if(!loginValid){

        return;
    }

    await loadBook();

}


/* =========================================================
   JALANKAN
========================================================= */

init();

</script>
