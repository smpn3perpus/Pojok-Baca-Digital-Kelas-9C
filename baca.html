<body>

<script type="module">

import * as pdfjsLib
from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://veffzxxrsjfgupynryog.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_2HoFz3ZTlrOX_DTGsIW3og_7cHS0LLG";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


/* =========================================================
   LOGIN
========================================================= */

const anggotaRaw =
    localStorage.getItem("pojok_baca_anggota");

if(!anggotaRaw){

    alert(
        "Silakan login terlebih dahulu."
    );

    window.location.href =
        "login.html";

    throw new Error(
        "Siswa belum login."
    );
}

let anggota;

try{

    anggota =
        JSON.parse(anggotaRaw);

}catch(error){

    localStorage.removeItem(
        "pojok_baca_anggota"
    );

    window.location.href =
        "login.html";

    throw error;
}


if(!anggota || !anggota.id){

    localStorage.removeItem(
        "pojok_baca_anggota"
    );

    window.location.href =
        "login.html";

    throw new Error(
        "Data siswa tidak valid."
    );
}


/* =========================================================
   DATA BUKU
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const bukuId =
    params.get("id");


if(!bukuId){

    tampilError(
        "ID buku tidak ditemukan."
    );

    throw new Error(
        "ID buku kosong."
    );
}


let buku = null;


/* =========================================================
   PDF
========================================================= */

let pdfDoc = null;
let halamanSekarang = 1;

let scale = 1;

let rendering = false;
let pendingPage = null;


/* =========================================================
   RIWAYAT
========================================================= */

let riwayatId = null;

let mulaiWaktu = null;

let totalDetik = 0;

let timerInterval = null;

let sedangAktif = false;

let inactivityTimer = null;

const BATAS_TIDAK_AKTIF =
    2 * 60 * 1000;


/* =========================================================
   AMBIL BUKU
========================================================= */

async function ambilBuku(){

    try{

        const {
            data,
            error
        } = await db
            .from("buku")
            .select("*")
            .eq("id", bukuId)
            .maybeSingle();


        if(error){

            throw error;
        }


        if(!data){

            throw new Error(
                "Buku tidak ditemukan di database."
            );
        }


        buku = data;


        document.getElementById(
            "judulBuku"
        ).textContent =
            buku.judul || "Tanpa Judul";


        document.getElementById(
            "infoBuku"
        ).textContent =
            [
                buku.penulis || "",
                buku.penerbit || "",
                buku.tahun_terbit || ""
            ]
            .filter(Boolean)
            .join(" • ");


        document.getElementById(
            "startTitle"
        ).textContent =
            buku.judul || "Siap Membaca";


    }catch(error){

        console.error(error);

        tampilError(
            "Buku gagal dimuat: " +
            error.message
        );
    }
}


/* =========================================================
   URL GOOGLE DRIVE
========================================================= */

function ambilDriveId(url){

    if(!url){
        return null;
    }

    let match =
        url.match(
            /\/file\/d\/([^/]+)/
        );

    if(match){
        return match[1];
    }

    match =
        url.match(
            /[?&]id=([^&]+)/
        );

    if(match){
        return match[1];
    }

    return null;
}


function buatUrlPdf(url){

    if(!url){
        return null;
    }

    const driveId =
        ambilDriveId(url);

    if(driveId){

        return (
            "https://drive.google.com/uc" +
            "?export=download&id=" +
            encodeURIComponent(driveId)
        );
    }

    return url;
}


/* =========================================================
   MULAI PEMBACA
========================================================= */

window.mulaiPembaca =
async function(){

    document.getElementById(
        "startScreen"
    ).style.display = "none";


    document.getElementById(
        "reader"
    ).classList.remove("hidden");


    /*
       Fullscreen dijalankan dari klik tombol
       sehingga browser mengizinkannya.
    */

    try{

        if(
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ){

            await document.documentElement
                .requestFullscreen();

        }

    }catch(error){

        console.log(
            "Fullscreen tidak tersedia:",
            error
        );
    }


    await bukaBuku();


    await mulaiRiwayat();


    aktifkanPembaca();


    resetInactivity();
};


/* =========================================================
   BUKA PDF
========================================================= */

async function bukaBuku(){

    if(!buku){

        return;
    }


    if(!buku.file_url){

        tampilError(
            "File PDF buku belum memiliki file_url."
        );

        return;
    }


    tampilLoading(true);


    try{

        const url =
            buatUrlPdf(
                buku.file_url
            );


        console.log(
            "Memuat PDF:",
            url
        );


        pdfDoc =
            await pdfjsLib
                .getDocument({
                    url:url,
                    withCredentials:false
                })
                .promise;


        document.getElementById(
            "totalPages"
        ).textContent =
            pdfDoc.numPages;


        document.getElementById(
            "pageInput"
        ).max =
            pdfDoc.numPages;


        document.getElementById(
            "canvasWrapper"
        ).style.display =
            "flex";


        tampilLoading(false);


        await renderPage(
            1
        );


    }catch(error){

        console.error(
            "PDF ERROR:",
            error
        );


        tampilLoading(false);


        tampilError(
            "PDF tidak dapat ditampilkan.<br><br>" +

            "Kemungkinan file Google Drive belum " +
            "dapat diakses oleh pembaca PDF.<br><br>" +

            "Anda masih dapat membuka file PDF secara " +
            "langsung melalui tombol di bawah."
        );


        buatTombolBukaDrive();

    }
}


/* =========================================================
   RENDER SATU HALAMAN
========================================================= */

async function renderPage(
    nomor
){

    if(!pdfDoc){
        return;
    }


    if(nomor < 1){
        nomor = 1;
    }


    if(
        nomor >
        pdfDoc.numPages
    ){

        nomor =
            pdfDoc.numPages;
    }


    halamanSekarang =
        nomor;


    if(rendering){

        pendingPage =
            nomor;

        return;
    }


    rendering = true;


    try{

        const page =
            await pdfDoc.getPage(
                nomor
            );


        const canvas =
            document.getElementById(
                "pdfCanvas"
            );

        const context =
            canvas.getContext("2d");


        const viewport =
            page.getViewport({
                scale:scale
            });


        canvas.width =
            viewport.width;

        canvas.height =
            viewport.height;


        await page.render({
            canvasContext:context,
            viewport:viewport
        }).promise;


        document.getElementById(
            "pageInput"
        ).value =
            nomor;


        document.getElementById(
            "pageStatus"
        ).textContent =
            "Halaman " +
            nomor +
            " / " +
            pdfDoc.numPages;


        document.getElementById(
            "zoomInfo"
        ).textContent =
            Math.round(
                scale * 100
            ) + "%";


        catatAktivitas();


    }catch(error){

        console.error(
            error
        );

        tampilError(
            "Halaman PDF gagal ditampilkan: " +
            error.message
        );

    }finally{

        rendering = false;


        if(pendingPage !== null){

            const next =
                pendingPage;

            pendingPage =
                null;

            renderPage(next);
        }
    }
}


/* =========================================================
   NAVIGASI HALAMAN
========================================================= */

window.halamanSebelumnya =
function(){

    if(!pdfDoc){
        return;
    }


    if(
        halamanSekarang <= 1
    ){

        catatAktivitas();

        return;
    }


    renderPage(
        halamanSekarang - 1
    );
};


window.halamanBerikutnya =
function(){

    if(!pdfDoc){
        return;
    }


    if(
        halamanSekarang >=
        pdfDoc.numPages
    ){

        catatAktivitas();

        return;
    }


    renderPage(
        halamanSekarang + 1
    );
};


window.lompatHalaman =
function(){

    if(!pdfDoc){
        return;
    }


    let nomor =
        parseInt(
            document.getElementById(
                "pageInput"
            ).value
        );


    if(
        isNaN(nomor)
    ){

        nomor =
            halamanSekarang;
    }


    if(nomor < 1){
        nomor = 1;
    }


    if(
        nomor >
        pdfDoc.numPages
    ){

        nomor =
            pdfDoc.numPages;
    }


    renderPage(
        nomor
    );
};


/* =========================================================
   ZOOM
========================================================= */

window.zoomMasuk =
function(){

    scale =
        Math.min(
            scale + 0.1,
            3
        );

    renderPage(
        halamanSekarang
    );
};


window.zoomKeluar =
function(){

    scale =
        Math.max(
            scale - 0.1,
            0.5
        );

    renderPage(
        halamanSekarang
    );
};


window.fitWidth =
function(){

    const wrapper =
        document.getElementById(
            "canvasWrapper"
        );


    if(!pdfDoc){
        return;
    }


    pdfDoc.getPage(
        halamanSekarang
    ).then(
        page => {

            const base =
                page.getViewport({
                    scale:1
                });


            const available =
                wrapper.clientWidth -
                25;


            scale =
                available /
                base.width;


            scale =
                Math.max(
                    0.5,
                    Math.min(
                        scale,
                        3
                    )
                );


            renderPage(
                halamanSekarang
            );

        }
    );
};


/* =========================================================
   FULLSCREEN
========================================================= */

window.fullscreen =
async function(){

    try{

        if(
            !document.fullscreenElement
        ){

            await document
                .documentElement
                .requestFullscreen();

            aktifkanPembaca();

            resetInactivity();

        }else{

            await document
                .exitFullscreen();

            /*
              Keluar fullscreen = berhenti membaca
              dan waktu disimpan.
            */

            hentikanTimerAktif();

            await simpanRiwayat();

            setStatusPaused(
                "⏸ Keluar fullscreen — waktu disimpan"
            );
        }

    }catch(error){

        console.error(
            error
        );

    }
};


/* =========================================================
   DETEKSI FULLSCREEN
========================================================= */

document.addEventListener(
    "fullscreenchange",
    async function(){

        if(
            document.fullscreenElement
        ){

            aktifkanPembaca();

            resetInactivity();

        }else{

            hentikanTimerAktif();

            await simpanRiwayat();

            setStatusPaused(
                "⏸ Keluar fullscreen — waktu disimpan"
            );
        }
    }
);


/* =========================================================
   RIWAYAT BACA
========================================================= */

async function mulaiRiwayat(){

    if(!anggota || !buku){
        return;
    }


    mulaiWaktu =
        new Date();


    totalDetik =
        0;


    try{

        const {
            data,
            error
        } = await db
            .from("riwayat_baca")
            .insert({
                anggota_id:anggota.id,
                buku_id:buku.id,
                mulai_baca:
                    mulaiWaktu.toISOString(),
                durasi_menit:0
            })
            .select("id")
            .single();


        if(error){

            console.error(
                "Gagal membuat riwayat:",
                error
            );

            return;
        }


        riwayatId =
            data.id;


    }catch(error){

        console.error(
            error
        );
    }
}


/* =========================================================
   TIMER
========================================================= */

function mulaiTimerAktif(){

    if(timerInterval){
        return;
    }


    timerInterval =
        setInterval(
            function(){

                if(
                    !sedangAktif
                ){
                    return;
                }


                totalDetik++;


                tampilkanTimer();


            },
            1000
        );
}


function hentikanTimerAktif(){

    sedangAktif =
        false;


    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;
    }


    tampilkanTimer();
}


function aktifkanPembaca(){

    if(
        !document.fullscreenElement
    ){

        /*
          Jika browser menolak fullscreen,
          pembaca masih dapat digunakan.
        */

    }


    sedangAktif =
        true;


    mulaiTimerAktif();


    setStatusActive();
}


function tampilkanTimer(){

    const menit =
        Math.floor(
            totalDetik / 60
        );

    const detik =
        totalDetik % 60;


    document.getElementById(
        "timer"
    ).textContent =
        String(menit).padStart(2,"0") +
        ":" +
        String(detik).padStart(2,"0");
}


/* =========================================================
   STATUS AKTIVITAS
========================================================= */

function setStatusActive(){

    const el =
        document.getElementById(
            "activityStatus"
        );


    el.className =
        "activity active";


    el.textContent =
        "● Sedang membaca";
}


function setStatusPaused(
    text
){

    const el =
        document.getElementById(
            "activityStatus"
        );


    el.className =
        "activity paused";


    el.textContent =
        text ||
        "⏸ Waktu berhenti";
}


/* =========================================================
   AKTIVITAS SISWA
========================================================= */

function catatAktivitas(){

    if(
        !document.getElementById(
            "reader"
        ).classList.contains("hidden")
    ){

        if(
            !document.fullscreenElement
        ){

            /*
              Tidak memaksa fullscreen.
              Tetapi waktu tetap bisa berhenti
              ketika siswa berada di luar fullscreen.
            */

        }


        if(
            !sedangAktif &&
            document.fullscreenElement
        ){

            aktifkanPembaca();
        }


        resetInactivity();
    }
}


/* =========================================================
   2 MENIT TANPA AKTIVITAS
========================================================= */

function resetInactivity(){

    if(
        inactivityTimer
    ){

        clearTimeout(
            inactivityTimer
        );
    }


    if(
        !document.fullscreenElement
    ){

        return;
    }


    if(
        !sedangAktif
    ){

        return;
    }


    inactivityTimer =
        setTimeout(
            async function(){

                hentikanTimerAktif();


                setStatusPaused(
                    "⏸ Tidak ada aktivitas selama 2 menit"
                );


                await simpanRiwayat();

            },
            BATAS_TIDAK_AKTIF
        );
}


/* =========================================================
   EVENT AKTIVITAS
========================================================= */

[
    "wheel",
    "touchstart",
    "touchmove",
    "mousedown",
    "keydown"
]
.forEach(
    eventName => {

        document.addEventListener(
            eventName,
            function(){

                if(
                    document.fullscreenElement
                ){

                    if(
                        !sedangAktif
                    ){

                        aktifkanPembaca();
                    }


                    resetInactivity();
                }

            },
            {
                passive:true
            }
        );
    }
);


/*
   Scroll khusus area PDF
*/

document.getElementById(
    "canvasWrapper"
).addEventListener(
    "scroll",
    function(){

        catatAktivitas();

    },
    {
        passive:true
    }
);


/* =========================================================
   SIMPAN RIWAYAT
========================================================= */

async function simpanRiwayat(){

    if(
        !riwayatId
    ){

        return;
    }


    try{

        const durasiMenit =
            Math.max(
                1,
                Math.floor(
                    totalDetik / 60
                )
            );


        const {
            error
        } = await db
            .from("riwayat_baca")
            .update({

                selesai_baca:
                    new Date().toISOString(),

                durasi_menit:
                    durasiMenit

            })
            .eq(
                "id",
                riwayatId
            );


        if(error){

            console.error(
                "Gagal menyimpan riwayat:",
                error
            );

        }

    }catch(error){

        console.error(
            error
        );
    }
}


/* =========================================================
   SELESAI MEMBACA
========================================================= */

window.selesaiMembaca =
async function(){

    hentikanTimerAktif();


    if(
        inactivityTimer
    ){

        clearTimeout(
            inactivityTimer
        );

        inactivityTimer =
            null;
    }


    await simpanRiwayat();


    /*
       Jika fullscreen aktif,
       keluar setelah riwayat disimpan.
    */

    try{

        if(
            document.fullscreenElement
        ){

            await document.exitFullscreen();

        }

    }catch(error){

        console.log(
            error
        );
    }


    window.location.href =
        "index.html";
};


/* =========================================================
   KATALOG
========================================================= */

window.kembaliKatalog =
function(){

    hentikanTimerAktif();


    simpanRiwayat()
        .finally(
            function(){

                window.location.href =
                    "index.html";

            }
        );
};


/* =========================================================
   SEBELUM HALAMAN DITUTUP
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        if(
            !riwayatId
        ){

            return;
        }


        const durasiMenit =
            Math.max(
                1,
                Math.floor(
                    totalDetik / 60
                )
            );


        const url =
            SUPABASE_URL +
            "/rest/v1/riwayat_baca?id=eq." +
            encodeURIComponent(
                riwayatId
            );


        try{

            fetch(
                url,
                {
                    method:"PATCH",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Prefer":
                            "return=minimal"
                    },

                    body:JSON.stringify({

                        selesai_baca:
                            new Date().toISOString(),

                        durasi_menit:
                            durasiMenit

                    }),

                    keepalive:true
                }
            );

        }catch(error){

            console.error(
                error
            );
        }
    }
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async function(){

        if(
            document.hidden
        ){

            hentikanTimerAktif();

            await simpanRiwayat();

            setStatusPaused(
                "⏸ Halaman tidak aktif — waktu disimpan"
            );

        }else{

            /*
              Tidak langsung menjalankan timer.
              Harus ada aktivitas lagi.
            */

            setStatusPaused(
                "▶ Lakukan aktivitas untuk melanjutkan"
            );
        }
    }
);


/* =========================================================
   LOADING
========================================================= */

function tampilLoading(
    tampil
){

    document.getElementById(
        "loading"
    ).style.display =
        tampil ?
        "flex" :
        "none";
}


/* =========================================================
   ERROR
========================================================= */

function tampilError(
    pesan
){

    const box =
        document.getElementById(
            "errorBox"
        );


    box.innerHTML =
        pesan;


    box.style.display =
        "block";
}


/* =========================================================
   TOMBOL BUKA DRIVE
========================================================= */

function buatTombolBukaDrive(){

    if(
        !buku ||
        !buku.file_url
    ){

        return;
    }


    const box =
        document.getElementById(
            "errorBox"
        );


    const old =
        document.getElementById(
            "driveButton"
        );


    if(old){
        return;
    }


    const button =
        document.createElement(
            "button"
        );


    button.id =
        "driveButton";


    button.className =
        "btn btn-primary";


    button.style.marginTop =
        "12px";


    button.textContent =
        "📖 Buka PDF";


    button.onclick =
    function(){

        window.open(
            buku.file_url,
            "_blank"
        );
    };


    box.appendChild(
        document.createElement("br")
    );


    box.appendChild(
        button
    );
}


/* =========================================================
   START
========================================================= */

await ambilBuku();


/*
   Tidak ada requestFullscreen()
   di sini.

   Fullscreen hanya dijalankan oleh:
   mulaiPembaca()
   atau tombol Fullscreen.
*/

document.getElementById(
    "startScreen"
).style.display =
    "flex";


</script>
