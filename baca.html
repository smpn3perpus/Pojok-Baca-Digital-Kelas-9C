<script type="module">

/* =========================================================
   PDF.JS
========================================================= */

import * as pdfjsLib
from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://veffzxxrsjfgupynryog.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2HoFz3ZTlrOX_DTGsIW3og_7cHS0LLG";


let db;

try{

    if(
        !window.supabase ||
        !window.supabase.createClient
    ){

        throw new Error(
            "Library Supabase tidak berhasil dimuat."
        );

    }


    db =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

}catch(error){

    console.error(error);

    document.getElementById(
        "loading"
    ).innerHTML = `

        <div class="error-box">

            <div class="error-icon">⚠️</div>

            <h2>Koneksi sistem bermasalah</h2>

            <p>
                Supabase tidak dapat dimuat.
                Periksa koneksi internet kemudian coba lagi.
            </p>

            <div class="error-detail">
                ${escapeHTML(error.message)}
            </div>

            <button
                class="back-btn"
                onclick="kembaliKeKatalog()"
            >
                ← Kembali ke Katalog
            </button>

        </div>

    `;

    throw error;
}


/* =========================================================
   VARIABEL
========================================================= */

let anggota = null;
let buku = null;
let pdfDoc = null;
let halamanSekarang = 1;
let totalHalaman = 0;
let zoom = 1;
let riwayatId = null;
let mulaiWaktu = null;
let timerInterval = null;
let waktuAktif = 0;
let sedangAktif = true;


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   CEK LOGIN
========================================================= */

function cekLogin(){

    const data =
        localStorage.getItem(
            "pojok_baca_anggota"
        );


    if(!data){

        window.location.replace(
            "login.html"
        );

        return false;
    }


    try{

        anggota =
            JSON.parse(data);


        if(
            !anggota ||
            !anggota.id
        ){

            throw new Error(
                "Data login siswa tidak valid."
            );

        }


        return true;

    }catch(error){

        console.error(error);


        localStorage.removeItem(
            "pojok_baca_anggota"
        );


        window.location.replace(
            "login.html"
        );


        return false;

    }

}


/* =========================================================
   AMBIL ID BUKU
========================================================= */

function ambilIdBuku(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    return params.get("id");

}


/* =========================================================
   CEK GOOGLE DRIVE
========================================================= */

function adalahGoogleDrive(url){

    if(!url){
        return false;
    }

    return (
        url.includes("drive.google.com") ||
        url.includes("docs.google.com")
    );

}


/* =========================================================
   AMBIL ID FILE GOOGLE DRIVE
========================================================= */

function ambilIdGoogleDrive(url){

    if(!url){
        return null;
    }


    let hasil =
        url.match(
            /\/file\/d\/([^\/]+)/
        );


    if(hasil && hasil[1]){
        return hasil[1];
    }


    hasil =
        url.match(
            /[?&]id=([^&]+)/
        );


    if(hasil && hasil[1]){
        return hasil[1];
    }


    return null;

}


/* =========================================================
   BUAT URL GOOGLE DRIVE
========================================================= */

function buatUrlGoogleDrive(id){

    return [
        `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}`,
        `https://drive.google.com/uc?id=${encodeURIComponent(id)}&export=download`
    ];

}


/* =========================================================
   URL ASLI DRIVE UNTUK TOMBOL
========================================================= */

function urlDriveAsli(url){

    const id =
        ambilIdGoogleDrive(url);


    if(id){

        return `https://drive.google.com/file/d/${id}/view`;

    }


    return url;

}


/* =========================================================
   TAMPILKAN ERROR
========================================================= */

function tampilkanError(
    pesan,
    tampilkanDrive = false
){

    const driveUrl =
        buku && buku.file_url
            ? urlDriveAsli(buku.file_url)
            : "";


    document.getElementById(
        "loading"
    ).innerHTML = `

        <div class="error-box">

            <div class="error-icon">
                ⚠️
            </div>

            <h2>
                Buku tidak dapat dibuka
            </h2>

            <p>
                ${escapeHTML(pesan)}
            </p>

            ${
                tampilkanDrive && driveUrl
                ?
                `
                <button
                    class="drive-btn"
                    onclick="bukaGoogleDrive()"
                >
                    📖 Buka PDF
                </button>
                `
                :
                ""
            }

            <button
                class="back-btn"
                onclick="kembaliKeKatalog()"
            >
                ← Kembali ke Katalog
            </button>

        </div>

    `;

}


/* =========================================================
   BUKA GOOGLE DRIVE
========================================================= */

window.bukaGoogleDrive =
function(){

    if(
        !buku ||
        !buku.file_url
    ){

        return;
    }


    const url =
        urlDriveAsli(
            buku.file_url
        );


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

};


/* =========================================================
   AMBIL DATA BUKU
========================================================= */

async function loadBuku(){

    const id =
        ambilIdBuku();


    if(!id){

        tampilkanError(
            "ID buku tidak ditemukan pada alamat halaman."
        );

        return;

    }


    try{

        const {
            data,
            error
        } = await db
            .from("buku")
            .select(`
                id,
                judul,
                penulis,
                penerbit,
                tahun_terbit,
                kategori,
                stok,
                gambar_url,
                file_url
            `)
            .eq("id",id)
            .maybeSingle();


        if(error){

            throw error;

        }


        if(!data){

            throw new Error(
                "Data buku tidak ditemukan di database."
            );

        }


        buku =
            data;


        document.getElementById(
            "bookTitle"
        ).textContent =
            "📖 " +
            (
                buku.judul ||
                "Tanpa Judul"
            );


        document.getElementById(
            "bookInfo"
        ).textContent =
            "👤 " +
            (
                buku.penulis ||
                "-"
            ) +
            "  •  📚 " +
            (
                buku.kategori ||
                "Umum"
            );


        if(!buku.file_url){

            throw new Error(
                "File PDF buku belum tersedia. Admin harus mengisi file_url terlebih dahulu."
            );

        }


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "readerContent"
        ).style.display =
            "block";


        await bukaPDF(
            buku.file_url
        );


        await mulaiMembaca();


    }catch(error){

        console.error(
            "Gagal membuka buku:",
            error
        );


        document.getElementById(
            "readerContent"
        ).style.display =
            "none";


        tampilkanError(
            error.message ||
            "Terjadi kesalahan saat membuka buku.",
            adalahGoogleDrive(
                buku?.file_url
            )
        );

    }

}


/* =========================================================
   BUKA PDF
========================================================= */

async function bukaPDF(url){

    /*
       Jika URL bukan Google Drive,
       langsung gunakan PDF.js.
    */

    if(
        !adalahGoogleDrive(url)
    ){

        try{

            await bukaPDFDenganPdfJS(
                url
            );

            return;

        }catch(error){

            console.error(
                "PDF biasa gagal:",
                error
            );

            throw new Error(
                "PDF tidak dapat dibuka. Pastikan URL file PDF benar dan dapat diakses publik."
            );

        }

    }


    /*
       Google Drive:
       ambil ID file kemudian coba
       URL download.
    */

    const fileId =
        ambilIdGoogleDrive(url);


    if(!fileId){

        throw new Error(
            "ID file Google Drive tidak dapat ditemukan dari file_url."
        );

    }


    const urls =
        buatUrlGoogleDrive(
            fileId
        );


    let errorTerakhir = null;


    for(
        const pdfUrl of urls
    ){

        try{

            console.log(
                "Mencoba membuka PDF:",
                pdfUrl
            );


            await bukaPDFDenganPdfJS(
                pdfUrl
            );


            return;

        }catch(error){

            console.error(
                "Percobaan PDF gagal:",
                error
            );


            errorTerakhir =
                error;

        }

    }


    throw new Error(
        "PDF Google Drive tidak dapat dimuat oleh pembaca otomatis. Kemungkinan file belum disetel 'Siapa saja yang memiliki link dapat melihat'."
    );

}


/* =========================================================
   PDF.JS
========================================================= */

async function bukaPDFDenganPdfJS(url){

    const loadingTask =
        pdfjsLib.getDocument({

            url:url,

            withCredentials:false,

            disableAutoFetch:false,

            disableStream:false

        });


    pdfDoc =
        await loadingTask.promise;


    if(
        !pdfDoc ||
        !pdfDoc.numPages
    ){

        throw new Error(
            "PDF tidak memiliki halaman."
        );

    }


    totalHalaman =
        pdfDoc.numPages;


    document.getElementById(
        "pageTotal"
    ).textContent =
        "/ " +
        totalHalaman;


    document.getElementById(
        "pageInput"
    ).max =
        totalHalaman;


    await tampilkanHalaman(
        halamanSekarang
    );

}


/* =========================================================
   TAMPILKAN HALAMAN
========================================================= */

async function tampilkanHalaman(nomor){

    if(!pdfDoc){

        return;

    }


    if(
        nomor < 1 ||
        nomor > totalHalaman
    ){

        return;

    }


    halamanSekarang =
        nomor;


    const page =
        await pdfDoc.getPage(
            halamanSekarang
        );


    const baseViewport =
        page.getViewport({
            scale:1
        });


    const container =
        document.getElementById(
            "pdfContainer"
        );


    let scale =
        zoom;


    if(zoom === 1){

        const availableWidth =
            Math.max(
                container.clientWidth - 20,
                300
            );


        scale =
            availableWidth /
            baseViewport.width;


        scale =
            Math.max(
                scale,
                0.5
            );

    }


    const viewport =
        page.getViewport({
            scale:scale
        });


    const canvas =
        document.getElementById(
            "pdfCanvas"
        );


    const context =
        canvas.getContext("2d");


    const outputScale =
        window.devicePixelRatio ||
        1;


    canvas.width =
        Math.floor(
            viewport.width *
            outputScale
        );


    canvas.height =
        Math.floor(
            viewport.height *
            outputScale
        );


    canvas.style.width =
        Math.floor(
            viewport.width
        ) +
        "px";


    canvas.style.height =
        Math.floor(
            viewport.height
        ) +
        "px";


    const renderContext = {

        canvasContext:
            context,

        viewport:
            viewport,

        transform:
            outputScale !== 1
            ?
            [
                outputScale,
                0,
                0,
                outputScale,
                0,
                0
            ]
            :
            null

    };


    await page.render(
        renderContext
    ).promise;


    document.getElementById(
        "pageInput"
    ).value =
        halamanSekarang;


    document.getElementById(
        "prevBtn"
    ).disabled =
        halamanSekarang <= 1;


    document.getElementById(
        "nextBtn"
    ).disabled =
        halamanSekarang >=
        totalHalaman;


    document.getElementById(
        "pdfContainer"
    ).scrollTop =
        0;

}


/* =========================================================
   HALAMAN SEBELUMNYA
========================================================= */

window.halamanSebelumnya =
function(){

    if(
        halamanSekarang > 1
    ){

        tampilkanHalaman(
            halamanSekarang - 1
        );

    }

};


/* =========================================================
   HALAMAN BERIKUTNYA
========================================================= */

window.halamanBerikutnya =
function(){

    if(
        halamanSekarang <
        totalHalaman
    ){

        tampilkanHalaman(
            halamanSekarang + 1
        );

    }

};


/* =========================================================
   LOMPAT HALAMAN
========================================================= */

window.lompatHalaman =
function(){

    let nomor =
        Number(
            document.getElementById(
                "pageInput"
            ).value
        );


    if(
        !Number.isFinite(nomor)
    ){

        nomor = 1;

    }


    nomor =
        Math.max(
            1,
            Math.min(
                totalHalaman,
                nomor
            )
        );


    tampilkanHalaman(
        nomor
    );

};


/* =========================================================
   ZOOM
========================================================= */

window.zoomMasuk =
function(){

    zoom =
        Math.min(
            zoom + 0.2,
            3
        );


    tampilkanHalaman(
        halamanSekarang
    );

};


window.zoomKeluar =
function(){

    zoom =
        Math.max(
            zoom - 0.2,
            0.6
        );


    tampilkanHalaman(
        halamanSekarang
    );

};


window.fitLebar =
function(){

    zoom = 1;


    tampilkanHalaman(
        halamanSekarang
    );

};


/* =========================================================
   FULLSCREEN
========================================================= */

window.fullscreen =
function(){

    const element =
        document.documentElement;


    if(
        !document.fullscreenElement
    ){

        if(
            element.requestFullscreen
        ){

            element.requestFullscreen();

        }

    }else{

        if(
            document.exitFullscreen
        ){

            document.exitFullscreen();

        }

    }

};


/* =========================================================
   MULAI RIWAYAT MEMBACA
========================================================= */

async function mulaiMembaca(){

    try{

        mulaiWaktu =
            new Date();


        const {
            data,
            error
        } = await db
            .from("riwayat_baca")
            .insert({

                anggota_id:
                    anggota.id,

                buku_id:
                    buku.id,

                mulai_baca:
                    mulaiWaktu.toISOString(),

                durasi_menit:
                    0

            })
            .select("id")
            .single();


        if(error){

            console.error(
                "Gagal menyimpan riwayat:",
                error
            );

            /*
               PDF tetap bisa dibaca
               walaupun riwayat gagal.
            */

            mulaiTimer();

            return;

        }


        riwayatId =
            data.id;


        mulaiTimer();


    }catch(error){

        console.error(
            "Riwayat membaca:",
            error
        );


        mulaiTimer();

    }

}


/* =========================================================
   TIMER
========================================================= */

function mulaiTimer(){

    if(timerInterval){

        clearInterval(
            timerInterval
        );

    }


    timerInterval =
        setInterval(
            function(){

                if(
                    sedangAktif
                ){

                    waktuAktif++;

                    tampilkanTimer();

                }

            },
            1000
        );

}


function tampilkanTimer(){

    const jam =
        Math.floor(
            waktuAktif / 3600
        );


    const menit =
        Math.floor(
            (waktuAktif % 3600) / 60
        );


    const detik =
        waktuAktif % 60;


    document.getElementById(
        "timer"
    ).textContent =

        String(jam).padStart(
            2,
            "0"
        )

        + ":"

        +

        String(menit).padStart(
            2,
            "0"
        )

        + ":"

        +

        String(detik).padStart(
            2,
            "0"
        );

}


/* =========================================================
   SIMPAN DURASI
========================================================= */

async function simpanDurasi(){

    if(!riwayatId){

        return;

    }


    const durasiMenit =
        Math.floor(
            waktuAktif / 60
        );


    try{

        await db
            .from("riwayat_baca")
            .update({

                durasi_menit:
                    durasiMenit

            })
            .eq(
                "id",
                riwayatId
            );

    }catch(error){

        console.error(
            "Gagal menyimpan durasi:",
            error
        );

    }

}


/* =========================================================
   SELESAI MEMBACA
========================================================= */

window.selesaiMembaca =
async function(){

    if(!buku){

        kembaliKeKatalog();

        return;

    }


    const yakin =
        confirm(
            "Apakah Anda sudah selesai membaca buku ini?"
        );


    if(!yakin){

        return;

    }


    await tutupRiwayat();


    window.location.href =
        "index.html";

};


/* =========================================================
   TUTUP RIWAYAT
========================================================= */

async function tutupRiwayat(){

    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;

    }


    if(!riwayatId){

        return;

    }


    const selesai =
        new Date();


    const durasiMenit =
        Math.floor(
            waktuAktif / 60
        );


    try{

        const {
            error
        } = await db
            .from("riwayat_baca")
            .update({

                selesai_baca:
                    selesai.toISOString(),

                durasi_menit:
                    durasiMenit

            })
            .eq(
                "id",
                riwayatId
            );


        if(error){

            console.error(
                "Gagal menutup riwayat:",
                error
            );

        }

    }catch(error){

        console.error(
            error
        );

    }

}


/* =========================================================
   KEMBALI KE KATALOG
========================================================= */

window.kembaliKeKatalog =
async function(){

    await tutupRiwayat();


    window.location.href =
        "index.html";

};


/* =========================================================
   PAUSE SAAT TAB TIDAK AKTIF
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        sedangAktif =
            !document.hidden;


        if(
            !document.hidden &&
            pdfDoc
        ){

            tampilkanHalaman(
                halamanSekarang
            );

        }

    }
);


/* =========================================================
   SIMPAN SAAT HALAMAN DITUTUP
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        if(!riwayatId){

            return;

        }


        const durasiMenit =
            Math.floor(
                waktuAktif / 60
            );


        fetch(

            SUPABASE_URL +
            "/rest/v1/riwayat_baca?id=eq." +
            encodeURIComponent(
                riwayatId
            ),

            {

                method:"PATCH",

                keepalive:true,

                headers:{

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    "Prefer":
                        "return=minimal"

                },

                body:
                    JSON.stringify({

                        durasi_menit:
                            durasiMenit

                    })

            }

        );

    }
);


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer;


window.addEventListener(
    "resize",
    function(){

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                function(){

                    if(pdfDoc){

                        tampilkanHalaman(
                            halamanSekarang
                        );

                    }

                },
                250
            );

    }
);


/* =========================================================
   MULAI APLIKASI
========================================================= */

if(
    cekLogin()
){

    loadBuku();

}

</script>
